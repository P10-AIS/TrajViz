services:
  client:
    build:
      context: ./client
      dockerfile: ./Dockerfile
    ports:
      - '8000:80'
    restart: unless-stopped
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: ./Dockerfile
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - /home/ubuntu/Experiments/Outputs/Datasets:/app/Data
      - /home/ubuntu/Experiments/Outputs/Predictions:/app/Predictions
      - /home/ubuntu/Experiments/Outputs/Images:/app/Images
